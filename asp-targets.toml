schema = 2

[targets.smokey]
description = "Smokey for agent-spaces"
priming_append = """


## Project: agent-spaces
- Uses Bun workspace, TypeScript. Run `just verify` before accepting changes.
- This project uses red/green TDD.
"""
compose = [ "space:smokey@dev", "space:defaults@dev", "space:praesidium-defaults@dev" ]

  [targets.smokey.provisioning]
  harness = "codex"
  reasoning_effort = "high"

[targets.curly]
description = "Curly for agent-spaces"
priming_append = """

## Project: agent-spaces
- Uses Bun workspace, TypeScript.
- Work with Larry on implementation, Smokey on testing.
"""
compose = [ "space:defaults@dev", "space:praesidium-defaults@dev" ]

[targets.animata]
description = "Animata facilitator for agent-spaces"
priming_append = """

## Project: agent-spaces
- Uses Bun workspace, TypeScript. Run `just verify` before accepting changes.
- Study `asp-targets.toml` to understand agent instructions for this project.
- Work with Larry/Curly on implementation, Smokey on testing.
"""
compose = [ "space:defaults@dev" ]

  [targets.animata.provisioning]
  reasoning_effort = "high"

[targets.animan]
description = "Animan for agent-spaces"
priming_append = """

## Project: agent-spaces
- Uses Bun workspace, TypeScript.
"""
compose = [ "space:defaults@dev", "space:praesidium-defaults@dev" ]

  [targets.animan.provisioning]
  yolo = true

[targets.larry]
description = "Larry for agent-spaces"
priming_append = """

## Project: agent-spaces
- Uses Bun workspace, TypeScript.
- Work with Curly as co-implementer, Smokey for test validation.
"""
compose = [ "space:defaults@dev", "space:praesidium-defaults@dev" ]

  [targets.larry.provisioning]
  reasoning_effort = "high"

[targets.locallarry]
description = "Local Larry clone (no agent profile, targets-only)"
priming = "You are locallarry, a test target with no agent profile."
compose = [ "space:defaults@dev" ]

  [targets.locallarry.provisioning]
  harness = "codex"
  reasoning_effort = "high"
  yolo = true

# Every agent that changes or operates agent-spaces in this project gets the
# verify-agent-spaces skill (spaces/verify-agent-spaces), as the foundry repo
# composes verify-foundry. compose_mode "merge" appends it to the agent's own
# base spaces; without it a target's compose replaces them. The resident
# (foundry@agent-spaces) gets it through its target here.

[targets.clod]
compose_mode = "merge"
compose = ["space:project:verify-agent-spaces"]

[targets.cody]
compose_mode = "merge"
compose = ["space:project:verify-agent-spaces"]

[targets.foundry]
compose_mode = "merge"
compose = ["space:project:verify-agent-spaces"]
