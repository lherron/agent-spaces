required_tests:
  - every seat-state turn-policy admission-class and authority cell produces the specified admit hold reject or interrupt outcome and one truthful disposition
  - obligation-bearing submissions cannot use steer and every steer surface excludes caller wait obligation and own-response options
  - steer live-state routing holds queue-only admission and terminal outcomes preserve agent-spaces.broker-steer-one-door while possibly-written recovery preserves agent-spaces.harness-broker-turn-evidence
  - queue list jump cancel TTL FIFO and snapshot replay preserve submission identity and authority
  - preempt with a surviving harness-local queue drives through drain-spawned turns to true quiescence with honest terminals and bounded slippage
  - every driver advertises supported admission classes and bracket-minting mode while new delivery-asserted drivers fail conformance
  - decision events replay and persist through the existing broker event stream without consumers reading harness transcripts
  - a Codex correlation loss emits one indeterminate submission.lost followed by non-retryable invocation.failed, drains no later same-seat input, settles the HRC run failed, crashes the runtime, and causes the next submission to provision fresh
  - codex-tui launch and later queue inputs stay broker-held until the slot is free reach Codex one at a time and preserve identity under pane goal interrupt and resume races
  - codex-tui delivery returns at the queue acknowledgement before any turn exists and own attribution then records executed with the turn manifest listing the submission
  - a codex-tui observed turn that never shows the pending input frees the slot at its terminal, the next input runs, and a complete queue read showing the row gone records exactly one left-queue-unattributed submission.lost with no invocation.failed
  - a failed or partial codex-tui queue read leaves the submission undisposed and does not block the next input
  - a codex-tui unknown terminal contests a pending delivery and emits lost then failed while foreign attribution never contests
  - invocation exit or failure records exactly one teardown submission.lost for every undisposed submission including a possibly_written delivery and the pending own-turn delivery, cancels only never-handed-over inputs, and records every such terminal before invocation.exited or invocation.failed
  - a steer absorbed before a delayed initiating attribution on the same observed turn remains in that turn's manifest beside the initiator
  - a steer in the pending own-turn window waits then lands on that turn as native steering and is never refused busy or recorded possibly_written
last_verified:
  date: 2026-11-17
  evidence: Daedalus source-grounded approval of T-13687 revision 2 (EN-57007); unchanged daedalus-manifest-probe.test.ts passed 1 test and test/admission/teardown-settlement.test.ts passed 3 tests, demonstrating retained manifest membership and submission terminals before invocation exit; results under the T-13687 artifact directory as daedalus-manifest-probe.rev2.result.txt and daedalus-teardown-rev2.result.txt; full implementation gates and installed acceptance not verified by this consult
reopen_when:
  - cross-seat scheduling or caller policy moves into the broker
  - an admission class changes own-turn obligation wait or disposition semantics
  - preempt no longer drives to quiescence before admitting its held submission
  - queue identity authority cancellation TTL ordering snapshot or replay semantics change
  - a TUI mechanic requires navigation-key choreography or an unsupported capability is emulated
  - turn evidence disposition or manifest contracts change
  - submission.lost gains definite execution meaning, or a turn-correlation-lost loss permits later same-seat delivery or stops forcing failed-run fresh-runtime recovery
  - a left-queue-unattributed loss is recorded without a complete provider queue read, a teardown loss before invocation exit or failure or after its terminal, or a handed-over submission is cancelled at teardown
  - codex-tui admits exclusive bypasses broker-held FIFO delivery lets foreign attribution contest permits drain after unknown attribution or makes delivery wait on attribution
  - a steer is held behind or refused by a busy seat or starts a second own turn while the slot is held
