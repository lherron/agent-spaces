id: agent-spaces.harness-broker-admission
kind: invariant
status: active
owner_project: agent-spaces
scope: per-seat harness-broker admission disposition control and observation contract
predicate: >
  One harness-broker owns one harness process and exposes per-seat mechanism;
  HRC permanently owns cross-seat scheduling and caller policy. Every mediated
  submission enters exactly one requested admission class: steer follows
  agent-spaces.broker-steer-one-door, starting an idle turn or seeking absorption
  into a live turn with broker-owned holds and queue-only routing; queue remains
  broker-held FIFO until idle and then originates its own turn; exclusive
  originates a turn only when immediately idle or rejects busy; preempt is
  authority-gated, interrupts the live turn and every drain-spawned successor
  until true quiescence, then injects the held submission as its own turn while
  recording any fast completion honestly. Every submission has stable identity,
  exactly one authoritative disposition, and a turn manifest mapping each turn
  to the submissions it carried. If a codex-cli-tmux own-turn delivery reaches
  a contested turn terminal without truthful content correlation, the broker
  records submission.lost with execution explicitly indeterminate, then records
  a non-retryable invocation.failed before any later same-seat delivery; HRC
  owns failed-run projection and fresh-runtime provisioning. A codex-tui
  codex-app-server seat advertises steer and queue only: launch and later queue
  submissions remain in the broker-held FIFO until the own-turn slot is free,
  and one head at a time is handed to Codex's queue with its broker input
  identity. That delivery completes at Codex's queue acknowledgement and never
  waits on attribution; the slot is freed only by a turn boundary, either the
  head's own attribution or the terminal of an observed turn that never
  correlated it, so a later head can reach Codex's queue while an earlier
  unbound one still sits there. A foreign human or autonomous turn never
  contests that pending delivery. An unbound codex-tui submission is settled
  from Codex's queue state alone: when a complete, valid queue read at a turn
  terminal shows its row gone and no turn has claimed it, the broker records
  submission.lost with reason left-queue-unattributed and execution explicitly
  indeterminate, without invocation.failed; a failed or partial read settles
  nothing. If an observed turn terminalizes before any item supplies ownership
  evidence, the turn is unknown; it contests the pending delivery and records
  submission.lost with reason turn-correlation-lost then non-retryable
  invocation.failed before another same-seat input can drain. At invocation
  exit or failure, before the invocation's own terminal is recorded, inputs never
  handed to the driver are cancelled and every other undisposed submission,
  including an own-turn delivery still awaiting its turn, is recorded
  submission.lost with reason teardown, so each submission ends with exactly one
  terminal. Own attribution of a turn names its owner without removing a
  submission the turn's manifest already carries, such as a steer absorbed
  before a delayed initiating user item. A
  steer is never held behind or refused by a busy seat: in a pending own-turn
  window with no harness turn it waits for the next turn start or slot change
  and then injects into that turn, never starting a second own turn while the
  slot is held, and any refusal before a write carries not_written.
  Obligation-bearing
  submissions use only queue, exclusive, or preempt and originate a dedicated
  turn; steer carries no obligation, caller wait, or own response. Its routing
  and terminal requirements are governed by agent-spaces.broker-steer-one-door.
  Admission composes driver capability, active-turn policy, and caller authority
  without silent class upgrades. For steer to a live seat, capability and guarded
  policy select broker-owned routing or holds rather than refusal; caller
  authority may still refuse. Possibly-written recovery remains governed by
  agent-spaces.harness-broker-turn-evidence. The broker-held queue is queryable,
  cancellable, TTL-aware, and reorderable under authority; admission queue disposition interrupt and
  capture decisions share the broker replay ledger and snapshot surface. TUI
  mechanics never use navigation-key choreography, and unsupported capabilities
  remain unset. Turn evidence and bracket-minting declarations remain governed by
  agent-spaces.harness-broker-turn-evidence and its bounded Pi accepted risk.
