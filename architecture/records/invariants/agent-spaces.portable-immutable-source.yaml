id: agent-spaces.portable-immutable-source
kind: invariant
status: active
owner_project: agent-spaces
scope: ASP lock generation and immutable space materialization
predicate: >
  A generated portable ASP lock records immutable space source authority only
  as repository identity plus canonical remote. Node-local mirror and store
  paths are explicit ASP-owned placement state and are never serialized into
  the lock. Immutable entries, including historical pins, resolve and populate
  snapshots from that canonical mirror placement; mutable @dev entries continue
  to resolve from the node-local agents root. Legacy path-bearing locks may be
  read only to regenerate them and are never repaired by rewriting path strings.
authority:
  repo: agent-spaces
  surface: spaces-config lock generation and materialization
source:
  - packages/config/src/core/schemas/lock.schema.json
  - packages/config/src/core/types/lock.ts
  - packages/config/src/resolver/closure.ts
  - packages/config/src/resolver/integrity.ts
  - packages/config/src/resolver/lock-generator.ts
  - packages/config/src/store/immutable-source.ts
  - packages/config/src/store/paths.ts
  - packages/config/src/orchestration/resolve.ts
  - packages/config/src/orchestration/install.ts
  - packages/config/src/orchestration/materialize-refs.ts
  - packages/config/src/orchestration/portable-immutable-source.test.ts
  - packages/agent-spaces/src/client-materialization.ts
  - packages/execution/src/run.ts
  - packages/execution/src/run/space-launch.ts
required_tests:
  - bun test packages/config/src/orchestration/portable-immutable-source.test.ts exits 0
  - bun run build exits 0
last_verified:
  date: 2026-07-25
  evidence: T-06951 mixed mutable and immutable portable-source regression
reopen_when:
  - the lock registry schema or immutable repository identity changes
  - mutable spaces stop resolving from the agents root
  - snapshot population or mirror placement moves to another owner
supersedes: []
superseded_by: null
