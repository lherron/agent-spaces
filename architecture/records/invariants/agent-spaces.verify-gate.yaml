id: agent-spaces.verify-gate
kind: invariant
status: active
owner_project: agent-spaces
scope: local handoff gate
predicate: >
  just verify is agent-spaces' local handoff gate and must include the
  architecture-records structure and projection-freshness check. Enforcement
  note (T-10161): `just verify` runs after each push to main on mini's
  self-hosted runner (`.github/workflows/post-push-verify.yml`), not in a git
  hook; pre-push only hands the refs to the best-effort `git.push` producer.
  `bun x lefthook install` supplies the executable post-commit entrypoint for
  the best-effort `git.commit` producer.
authority:
  repo: agent-spaces
  surface: justfile verify recipe
source:
  - justfile
  - lefthook.yml
  - .github/workflows/post-push-verify.yml
  - scripts/check-architecture-records.ts
  - scripts/lefthook-boundaries.test.ts
required_tests:
  - just verify exits 0
last_verified:
  date: 2026-09-05
  evidence: T-08054 landing `just verify` green with the hook topology above
reopen_when:
  - the verify recipe, architecture checker, or Git hook topology changes
supersedes: []
superseded_by: null
