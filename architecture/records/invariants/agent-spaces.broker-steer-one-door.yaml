id: agent-spaces.broker-steer-one-door
kind: invariant
status: active
owner_project: agent-spaces
scope: harness-broker steer admission across every live seat state
predicate: >
  A caller chooses steer by intent and never by seat state; HRC, mail delivery
  and other clients keep no door choice, fallback or hold derived from seat
  state. Subject to the refusal cases below, a harness-broker accepts
  submission.steer for every live invocation of a seat driver and makes it
  land: an idle seat starts a turn whose input is the steer; a busy seat
  injects it into the running turn; while an own-turn
  submission is handed over and its turn has not started, the steer waits for
  that turn and injects; while the invocation is starting, the steer is held
  until it is ready; a guarded turn is never steered into, and the steer waits
  for its terminal and then starts a turn; while a permission request is open,
  the steer is held and injects after the request resolves, so mediated text
  never answers a prompt; a pane refusal before paste, which writes nothing, is
  held and retried until the input is ready; a driver without the steer class
  admits it through its own queue. A host that owns idle turn creation
  (steerNeverStartsTurn) receives the steer and starts the turn itself.
  Permitted refusals are a stopping, exited, failed or disposed invocation
  (not_written), a request for fresh context (a new session under HRC
  lifecycle), denial by the host's authorization hook, and a harness write
  failure (not_written before any write, possibly_written after). The sole
  receiver-mode exception is a mail steer targeting a claude-desktop receiver
  whose latest hook reports bypassPermissions. For this
  Claude Desktop exception the broker writes nothing to the peer socket,
  reports not_written, and settles submission.rejected with reason
  receiver_bypass_permissions. The kicker leaves the envelope pending for
  ordinary retry or expiry. The Stop gate enforces reply obligations for presented mail,
  and crossSessionInbound stays unset. Possibly written recovery is
  unchanged and stays governed by agent-spaces.harness-broker-turn-evidence:
  Codex's same-submission own-turn fallback after an ambiguous failed steer
  RPC still runs, and a Claude pane failure after submit is not re-pasted. Every
  steer reaches exactly one submission terminal, and any other steer refusal is
  a broker defect.
authority:
  repo: agent-spaces
  surface: Lance's 2026-11-17 steer routing and refusal rulings in wrkq T-13668. Lance's 2026-11-23 Claude Desktop bypass mail exception as relayed in EN-60471 and recorded in T-14466 r3.
source:
  - wrkq:T-13668
  - wrkq:T-13687
  - wrkq:T-13689
  - wrkq:T-14466
  - wrkq:EN-60471
  - architecture/records/invariants/agent-spaces.harness-broker-admission.yaml
  - harness/harness-broker/src/invocation-submissions.ts
  - harness/harness-broker/src/invocation-admission.ts
  - harness/harness-broker/src/invocation-permissions.ts
  - harness/harness-broker/src/runtime/tmux.ts
  - architecture/records/invariants/agent-spaces.harness-broker-turn-evidence.yaml
required_tests:
  - a steer in each live seat state (idle, busy, handed-over pending, invocation starting, guarded turn, open permission request, pane not ready before paste, queue-only driver) lands as specified with exactly one submission terminal
  - a steer to a stopping, exited, failed or disposed invocation is refused not_written
  - an after-submit pane failure is reported possibly_written and not re-pasted, and the Codex ambiguous-RPC steer fallback still starts its same-submission own turn
  - no steer path refuses busy, guarded or capability for a live seat driver
last_verified:
  date: 2026-11-17
  evidence: ruling recorded; idle start, busy inject and Codex actuation-time resolution are live; the pending-window wait lands with T-13687 and the starting, guarded, permission, pane and queue-only holds with T-13689
reopen_when:
  - a new steer refusal reason is proposed for a live invocation
  - a caller needs seat state to choose between steer and queue
  - a hold can inject text into an open prompt
  - possibly written recovery for steer changes outside agent-spaces.harness-broker-turn-evidence
