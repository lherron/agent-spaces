id: agent-spaces.runtime-declaration-authority
kind: invariant
status: active
owner_project: agent-spaces
scope: placement-bound runtime declaration interpretation and read-only node observations
predicate: >
  Agent Spaces alone interprets mutable agent profiles, project targets,
  provisioning overlays, priming, harness/provider/frontend mappings, prompt
  composition, node-local harness capability, and historical continuation
  artifact format. HRC supplies its already-decided placement context and keeps
  project registry, task-worktree selection, home-node placement,
  authorization, continuation selection, launch, attachment, and lifecycle
  authority. resolveRuntimeDeclaration and inspectRuntimePlacement re-read
  applicable sources on every request; an exact caller agentRoot is read without
  roster search or substitution, project mode none reads no marker or target,
  and caller agent-source configuration is canonicalized, echoed, and never
  silently replaced by daemon configuration. Declaration absent and invalid
  remain distinct from producer unavailable and protocol/context incompatible.
  observeRuntimeCapability performs only bounded read-only detection and never
  reports a failed, timed-out, or over-limit probe as positive capability.
  observeContinuationArtifact uses key-bound frozen provider-home evidence for
  positive missing; unbound recorded placement may prove presence but absence
  remains unknown/home_not_historical. No unusable continuation silently starts
  fresh. Four additive preparation operations keep direct process invocation and
  Desktop identity, new-registration admission, and fresh-observer preparation
  under ASP authority without starting a native command or applying input.
  Direct preparation preserves the placement builder result and carries
  mandatory structured prompt content. Desktop identity remains separate from
  admission; existing registrations and durable reattach require no fresh
  preparation, and the native Desktop lifecycle stays external. The thin ASPC protocol/client closure carries DTOs, validation,
  framing, and transport only, never configuration, compiler, adapter, or
  provider implementations.
