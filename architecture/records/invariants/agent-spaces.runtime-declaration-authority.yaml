required_tests:
  - caller source roots are canonical and echoed while exact agent roots perform no search or substitution
  - root infer-from-cwd and none project modes remain distinct and none reads no project declaration
  - repeated requests observe mutable profile and target changes without daemon restart
  - declaration absent invalid unavailable and incompatible retain distinct typed result arms
  - prompt present absent and invalid retain compiled inspection facts and share the preparation environment rule
  - compile inspection and direct preparation derive prompt identity correlation environment and effectiveEnvironmentHash from one preparation execution context while dispatchEnv changes neither prompt facts nor that hash
  - inspect preparation correlation is advertised by the exact capability and consumers requiring parity fail closed when it is absent
  - explicit compile aspHome and validated caller agentSources exclusively anchor prompt discovery while ambient source arms apply only when no explicit source exists and the arms are never merged
  - conflicting sessionRef and explicit context agent project or task identity returns configured_context_mismatch before materialization
  - capability detection is fresh bounded read-only and failed probes are never positive
  - key-bound frozen continuation evidence may return missing while unbound recorded placement returns present or unknown only
  - standalone aspd advertises and serves all four operations over its immutable release identity
  - direct preparation is byte-equal to the existing placement builder and always carries structured system and priming prompt keys
  - Desktop identity precedes durable lookup while admission and fresh observer preparation perform bounded provider-native validation without starting the native process
last_verified:
  date: 2026-09-17
  evidence: T-08563 revision 5 approved by daedalus EN-13318; T-08574 preparation approved by astra EN-13542
reopen_when:
  - declaration interpretation moves into HRC or another consumer
  - a daemon cache prevents request-time source reload
  - HRC project registry or task-worktree policy moves into aspd
  - capability observation starts an agent process applies input or materializes an invocation
  - continuation absence is inferred from an unbound or newly selected provider home
  - thin protocol clients acquire implementation dependencies
  - inspection direct preparation and launch preparation stop sharing one preparation execution context
  - dispatchEnv becomes a template exec predicate interpolation or preparation-environment-hash input
  - explicit and ambient prompt-source authority are merged or silently substituted
