id: agent-spaces.harness-broker-turn-evidence
kind: invariant
status: active
owner_project: agent-spaces
scope: harness-broker turn brackets and external-TUI submission disposition attribution
predicate: >
  Except for the bounded legacy risk recorded as
  agent-spaces.pi-delivery-asserted-turn-start, harness-broker turn lifecycle
  brackets are minted only at the evidence moment declared by the driver:
  delivery-acknowledged drivers may open a bracket after an answered harness
  handshake, while harness-evidence drivers open one only from a hook or
  transcript observation. The declaration is advertised per driver and gates
  the shared delivery-time synthesis. agent-harness-tmux remains
  delivery-acknowledged so a rejected turn.begin opens turn.started before
  turn.failed. codex-cli-tmux remains harness-evidence: state at the
  driver/manager boundary may attach a pending broker input to an input-ID-less
  native UserPromptSubmit only when exact or otherwise unambiguous
  prompt-content evidence matches; priming and different operator prompts remain
  unowned, and turn order never lends identity. An unmatched contested terminal
  records indeterminate submission.lost followed by non-retryable
  invocation.failed, so no later input drains into that invocation.
  claude-code-tmux is harness-evidence: an overlapping prompt is buffered
  without a user.message until strict-order harness evidence resolves it. A
  remove row alone resolves nothing; hook-driven transcript rows are consumed
  before the triggering hook's own effects, and correlated remove and
  queued_command rows join the then-live turn through submission.absorbed,
  including batched remove-and-attachment sequences. Unresolved removal
  evidence warns and remains pending rather than minting a terminal disposition.
  Dequeue only marks a prompt drain-pending, the later plain user row opens an
  executed turn, and an interrupt marker terminalizes the still-active original
  turn. Each tracked prompt produces exactly one disposition and at most one
  user.message; absorption never fabricates a new turn bracket.
