  - wrkq:T-07962
  - harness/harness-broker/src/invocation-manager.ts
  - harness/harness-broker/src/drivers/claude-code-tmux/driver.ts
  - harness/harness-broker/src/drivers/claude-code-tmux/hook-transcript.ts
  - harness/harness-broker/src/drivers/claude-code-tmux/hook-events.ts
  - harness/harness-broker/src/drivers/claude-code-tmux/turn-attribution.ts
  - harness/harness-broker/src/drivers/agent-harness-tmux/driver.ts
  - architecture/records/invariants/agent-spaces.agent-harness-runtime-boundary.yaml
required_tests:
  - archived Claude queue-operation replays preserve strict dequeue interrupt and user-row ordering
  - batched Claude remove and queued_command rows resolve every correlated prompt exactly once on the then-live turn
  - an unresolved Claude remove warns without a disposition and remains pending until a correlated attachment, recall evidence, or teardown authority resolves it
  - active-turn applyInputNow absorption opens no allocated-id bracket while execution opens on the observed user row
  - agent-harness-tmux negative turn.begin acknowledgement emits turn.started before turn.failed
  - pi-tui-tmux delivery-asserted regression preserves its existing observable lifecycle
  - live claude-code-tmux matrix evidence exposes one disposition per tracked prompt without transcript snooping by consumers
  - recorded and live codex-cli-tmux cases prove two matching prompt turns, negative priming and operator controls, and fail-closed lost correlation with no later same-seat drain
last_verified:
  date: 2026-09-03
  evidence: Daedalus source-grounded design approval of T-07962 rev 3 established content-evidence-only Codex attribution and indeterminate lost-correlation failure; implementation gates remain pending
reopen_when:
  - a driver changes bracket-minting declaration or evidence moment
  - claude-code-tmux queue-operation vocabulary ordering or absorption signature changes
  - the shared applyInputNow synthesis or agent-harness turn.begin gate changes
  - a tracked prompt can emit multiple dispositions multiple user.message rows or a terminal against the wrong turn
  - submission.absorbed or the turn manifest no longer identifies the turn a steer joined
  - codex-cli-tmux attribution borrows identity by turn order, owns a nonmatching prompt, or permits same-seat drain after lost correlation
