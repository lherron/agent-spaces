required_tests:
  - wherever direct and compatibility paths require the same agent space prompt context skill provisioning validation inspection or diagnostic answer they consume one ASP-owned implementation
  - a hermetic agent-resource-parity/v1 fixture independently projects compiler and SDK prompt reminder and effective skill resources for query heartbeat task and maintenance and negative controls make byte metadata missing-entry symlink and executable-mode changes fail
  - the live agent-resource-parity/v1 gate compares every valid fleet agent in all four run modes while unexpected invalid roots newly valid exclusions and stale exclusions fail
  - the default direct path starts and runs without a live ASPC compile request compiled frontier-harness process plan or generated external-harness home
  - explicit Claude Code and Codex CLI selections remain operable through compiler-backed compatibility lowering after the direct path becomes default
  - installed real-agent direct-path evidence covers prompt context skills tools authentication multi-turn continuation steer interrupt structured results and HRC-visible events
  - HRC can start stop and reconnect the direct harness with runtime placement session routing supervision and durable messaging authority unchanged
  - installed evidence covers at least one explicitly selected external-harness agent through the retained compatibility path
last_verified:
  date: 2026-08-24
  evidence: hrcchat#20758 approved by daedalus against current compiler agent-harness-sdk Pi loader context resolver mode composition and live agent inventory source
reopen_when:
  - shared ASP semantics split into independent direct and compatibility implementations
  - HRC runtime placement lifecycle routing supervision or durable messaging authority moves into an execution lowering
  - the default direct path again requires compiler or external-harness artifacts
  - supported external-harness compatibility selections change
  - the installed real-agent cutover evidence or required product behavior changes
  - the agent-resource-parity/v1 equivalence scope producer seams mode matrix or fleet inclusion policy changes
  - a new sandbox credential provenance resource-identity or deferred-capability requirement is adopted
