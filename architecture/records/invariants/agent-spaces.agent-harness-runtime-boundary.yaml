required_tests:
  - both agent-harness profiles use the native-worker shape and reject a process command arguments in-process pty jsonrpc-stdio and private-control declarations
  - presentation false selects agent-harness without a terminal while presentation true selects the agent-harness-tmux birth variant with an HRC-owned tmux terminal surface
  - a later presentation request never replaces a live headless worker and requires an explicit lifecycle replacement to change birth variant
  - inspection preserves the distinct agent-harness identity and internal Pi provider/model binding rather than exposing or falling through to a generic Pi SDK harness
  - compiled profiles preserve semantic agent identity model provider auth reasoning permission continuation and correlation inputs under the invocation hash
  - one identity-bound release executable advertises both drivers reports its embedded release identity and is selected only through explicit inspected bindings
  - release closure inspection rejects checkout paths identity mismatch digest drift missing inventory and a binding to another executable
  - headless broker input runs in the outer worker-owned Pi runtime and emits directly through the ordinary DriverContext without a child
  - interactive launch consumes the HRC pane lease starts the same immutable executable as a child and verifies its standard broker hello plus exact release identity
  - interactive broker and operator inputs use the child's same live session mapper and invocation identity while the outer broker emits one monotonic HRC-facing sequence
  - interactive clean leave exits only the child and leaves the outer broker responsive until stop or dispose
  - no active implementation source or serialized runtime contract declares agent-harness-control/v1 turn-begin session-config or another private child wire protocol
  - isolated aspd preparation returns the exact immutable worker and positive hostedDrivers then a real headless turn completes from that executable
  - a real tmux proof launches the exact worker in the leased surface completes broker and operator turns survives detach and remains controllable until stop
  - direct source resolution and every replacement session preserve the custom ASP resource loader with no adapter lowering generated merged Pi bundle or ambient discovery
  - foreground TUI and print plus existing external generic Pi Muse Arris and Desktop routes regress cleanly
last_verified:
  date: 2026-09-21
  evidence: owner-approved T-08680 native-worker design recorded; implementation evidence pending
reopen_when:
  - HRC gains agent-harness-specific planning registration runtime imports executable selection or a private child protocol
  - either driver uses in-process pty jsonrpc-stdio or a serialized process command instead of native-worker
  - the interactive route launches anything except the same release executable or uses anything except the standard broker protocol on its worker-local socket
  - the TUI child exit can terminate the outer worker or the outer driver maps Pi events independently of the child
  - either driver is inferred rather than positively bound to the inspected immutable executable
  - Pi or pi-sdk becomes a public harness identity provider-derived fallback or selectable compatibility route
  - a later presentation request silently replaces a live headless worker
  - the direct runtime requires a harness adapter compiler-built Pi bundle or ambient Pi resource discovery
  - a replacement session can lose the custom ASP resource loader
  - foreground execution attaches to an HRC runtime or stops sharing the first-party runtime factory
