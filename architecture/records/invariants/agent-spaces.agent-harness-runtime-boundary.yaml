required_tests:
  - wherever direct and compatibility paths require the same agent space prompt context skill provisioning validation inspection or diagnostic answer they consume one ASP-owned implementation
  - the direct source resolver returns ordered raw or immutable-snapshot roots without invoking a harness adapter target materializer or compiler lowering
  - the direct resource loader maps prompt replace append and reminder zones exactly loads selected skills with Pi native parsing disables ambient Pi discovery and fails before successful reload
  - every Pi replacement-session path creates reloads and installs a fresh AgentSpacesResourceLoader for the active cwd
  - foreground and broker authentication bind their caller-selected auth path and API-key environment to ModelRuntime before model and session creation and a broker invocation cannot fall back to the foreground auth store
  - a hermetic agent-resource-parity/v1 fixture independently projects compiler and production direct-loader prompt reminder and effective skill resources for query heartbeat task and maintenance and negative controls make byte metadata missing-entry symlink executable-mode and generated-bundle-root changes fail
  - the live agent-resource-parity/v1 gate compares every valid fleet agent in all four run modes while unexpected invalid roots newly valid exclusions and stale exclusions fail
  - the default direct path starts and runs without a live ASPC compile request compiled frontier-harness process plan harness adapter generated merged Pi bundle or generated external-harness home
  - asp run for an agent-harness agent launches the real Pi TUI with the praesidium-loader theme and supports initial prompt new resume fork interrupt and clean disposal while noninteractive execution uses the same runtime in print mode
  - dry-run and print-command resolve the direct semantic launch without loading resources creating session state or writing compiler materialization residue
  - explicit Claude Code and Codex CLI selections remain operable through compiler-backed compatibility lowering after the direct path becomes default
  - installed real-agent direct-path evidence covers prompt context skills tools authentication multi-turn continuation steer interrupt structured results and HRC-visible events
  - HRC can start stop and reconnect the direct harness with runtime placement session routing supervision and durable messaging authority unchanged
  - installed evidence covers at least one explicitly selected external-harness agent through the retained compatibility path
  - the HRC-launched interactive TUI receives broker-allocated turn identity through an acknowledged handshake before input delivery and no turn body event reaches the ledger before the broker turn bracket
  - the HRC-launched interactive TUI constructs no agent load model runtime or session until the broker's admitted session configuration validates and a withheld malformed or late configuration fails startup
  - a broker invocation lowered permission deny is blocked inside the process that owns the tool call even when the agent profile yolo value would independently resolve to allow
  - agent-harness-tmux refuses ask-client permission policy at admission rather than downgrading or silently substituting an in-pane decision
  - an agent-harness-tmux profile carrying an sdk block with pty transport is admitted while the same profile with in-process transport is refused
  - agent-harness-tmux is a required row in the harness-agnostic driver certification matrix with no scenario or event exemptions
last_verified:
  date: 2026-08-25
  evidence: hrcchat#20917 approved by daedalus against the r4 third-surface design covering acknowledged turn-identity and session-config handshakes in-process permission binding and split sdk-block versus in-process-host admissibility
reopen_when:
  - shared ASP semantics split into independent direct and compatibility implementations
  - broker-mediated interactive tool approval is required on the HRC-launched interactive TUI surface
  - a fourth outer surface consumes the direct runtime factory
  - the HRC interactive surface can deliver input before broker turn identity binds or construct a session before the admitted session configuration validates
  - the HRC interactive child re-derives broker-owned auth permission agent SDK or continuation values instead of consuming the admitted projection
  - SDK-block admissibility and in-process hosting become coupled again for agent-harness-tmux
  - HRC runtime placement lifecycle routing supervision or durable messaging authority moves into an execution lowering
  - the default direct path requires compiler adapter output or a generated merged Pi bundle
  - a Pi session replacement can lose the custom ASP resource loader
  - foreground asp run and the broker cease using the same runtime factory
  - the loader validation theme or real TUI requirement changes
  - supported external-harness compatibility selections change
  - the installed real-agent cutover evidence or required product behavior changes
  - the agent-resource-parity/v1 equivalence scope producer seams mode matrix or fleet inclusion policy changes
  - a new sandbox credential provenance resource-identity or deferred-capability requirement is adopted
