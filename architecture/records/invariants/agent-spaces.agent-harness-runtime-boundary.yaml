id: agent-spaces.agent-harness-runtime-boundary
kind: invariant
status: active
owner_project: agent-spaces
scope: Praesidium-owned agent harness composition and live-launch authority
predicate: >
  Praesidium has two supported execution lowerings from one ASP-owned semantic
  resolution boundary. The default agent-harness path constructs and operates a
  Pi AgentSessionRuntime through agent-harness-runtime. A custom Pi
  AgentSpacesResourceLoader is the sole direct-path resource-delivery boundary:
  it resolves ordered mutable and immutable-snapshot ASP sources, compiles the
  contextual prompt and reminder, and uses Pi's native loaders for selected
  resources without consuming an ASPC-produced frontier-harness plan, harness
  adapter lowering, generated merged Pi bundle, or generated external-harness
  home. The loader is created and reloaded inside Pi's replacement-session
  factory so new, resumed, forked, imported, and cwd-replaced sessions keep the
  same ASP resource authority. The direct runtime has three outer surfaces that
  all use the same createAgentHarnessRuntime factory: local foreground TUI/print
  execution selected by asp run, the HRC-operated headless agent-harness broker
  service, and an HRC-launched interactive TUI in a broker-leased tmux pane. The
  third surface is fresh and HRC-owned; it does not attach to a foreground
  session. Across its process boundary, broker-allocated turn identity and the
  broker's admitted session configuration bind before input delivery and session
  construction respectively; the child does not re-derive broker-owned auth or
  permission values. SDK-backed model configuration is independent of process
  hosting: agent-harness-tmux carries the SDK binding with pty/tmux execution
  rather than the in-process sentinel. The TUI starts with the loader-supplied
  praesidium-loader validation theme, while mechanical
  assertions and parity tests remain the correctness authority. Agents that
  explicitly select Claude Code or Codex CLI retain a compiler-backed
  compatibility path that may produce the artifacts those external harnesses
  require. Both lowerings consume shared ASP resolution semantics but own
  distinct post-resolution representations. The verifier-only
  agent-resource-parity/v1 format independently compares compiler output with
  the production direct resource loader for ASP-authored prompt mode/content,
  reminder presence/content, and effective skill catalog/package bytes across
  query, heartbeat, task, and maintenance for every valid fleet agent. HRC
  remains authority for runtime placement, lifecycle, session routing,
  supervision, and durable messaging; foreground asp run is a separate local
  session and does not attach to an existing HRC runtime. Broker-selected auth
  path, provider, mode, and composed environment bind the shared ModelRuntime
  before model lookup and session creation, without fallback to the foreground
  auth store. Every Earendil Pi object-sharing consumer—drivers/harness-pi-sdk,
  harness/harness-broker-pi-sdk, harness/agent-harness-runtime,
  harness/agent-harness, and spaces-integration-tests—resolves exact version
  0.84.3 with coherent @earendil-works/pi-* lock entries. Runtime internal DTOs,
  credential transport beyond that binding, broker wire/process topology, and
  support for additional resource categories remain implementation choices
  unless another active contract fixes them.
