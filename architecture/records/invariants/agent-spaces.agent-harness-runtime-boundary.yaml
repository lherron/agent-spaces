id: agent-spaces.agent-harness-runtime-boundary
kind: invariant
status: active
owner_project: agent-spaces
scope: Praesidium-owned agent harness composition and live-launch authority
predicate: >
  The production agent runtime is one long-lived Praesidium-owned agent-harness
  controlled through harness-broker/0.2. HRC remains authority for placement,
  leases, durable input, lifecycle policy, attach and replay, event projection,
  stop, and reaping; the harness executes that authority and never replaces it.
  agent-harness-sdk is the only package that imports the exactly pinned Pi
  coding-agent runtime, using createAgentSession and ModelRuntime rather than
  the unfinished generic AgentHarness. Its live bootstrap accepts semantic
  identity, trusted roots, cwd, provisioning overrides, continuation, initial
  input, explicit dispatch secrets, and HRC lifecycle policy; it resolves ASP
  configuration and resources internally once per harness generation into an
  immutable RuntimeDefinition and sorted resource manifest with content hash.
  No compiled process plan, harness-specific argv, generated home, ambient
  resource discovery, or process-environment credential overlay crosses that
  launch boundary. Resources and auth or tool subprocess environments are
  supplied explicitly, duplicate resource names fail, and existing sessions
  retain their startup snapshot until recycled. V1 includes prompt and context,
  skills, Pi built-in tools, HRC permission and audit, API-key and OAuth auth,
  persistent continuation, steering and interrupt, structured results, and
  normalized broker events; it excludes arbitrary in-process extensions, hook
  bridges, MCP, slash commands, and interactive TUI. ASP retains schema,
  agent-space resolution, lock/store/integrity, hygiene/validation, and offline
  inspect/build authority. The compiler and frontier-driver live-launch paths
  retire only after the strangler proves prompt/resource byte and hash parity,
  composed-binary real end-to-end parity, and route cutover; broker/0.2 and its
  ledger remain until a separately approved simplification proves equivalent
  restart survival.
authority: hrcchat#20689
source:
  - hrcchat#20689
  - harness/harness-broker-pi-sdk/src/driver.ts
  - harness/harness-broker/src/broker.ts
  - contracts/harness-broker-protocol/src/invocation.ts
  - docs/harness-architecture.md
required_tests:
  - dependency boundaries permit only agent-harness-sdk to import the exactly pinned Pi coding-agent runtime
  - semantic bootstrap resolves one immutable RuntimeDefinition and sorted resource manifest per harness generation without accepting a compiled process plan harness argv or generated home
  - ambient extensions skills prompts themes context files and process environment credentials cannot enter the runtime while explicit resources auth and subprocess environment do
  - duplicate explicit resource names reject startup
  - HRC retains placement lease durable-input lifecycle attach-replay event-projection stop and reaping control through harness-broker/0.2
  - prompt and resource bytes and hashes match the compiler oracle before route cutover
  - the composed binary passes real end-to-end parity before compiler and frontier-driver live-launch removal
  - HRC restart reattaches and replays the same live broker generation without duplicate launch or event loss
last_verified:
  date: 2026-08-24
  evidence: hrcchat#20689 approved by daedalus against Pi 0.84.3 and current broker/HRC source
reopen_when:
  - Pi import ownership or the pinned production API changes
  - HRC runtime or broker authority moves into the SDK
  - the semantic bootstrap or per-generation snapshot boundary changes
  - an excluded V1 resource or interactive surface enters the trusted runtime boundary
  - broker/0.2 or its durable ledger is proposed for retirement
  - the compiler or frontier-driver retirement gate changes
supersedes:
  - agent-spaces.raspc-migration-contract
superseded_by: null
