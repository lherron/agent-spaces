id: agent-spaces.agent-harness-runtime-boundary
kind: invariant
status: active
owner_project: agent-spaces
scope: Praesidium-owned agent harness composition and live-launch authority
predicate: >
  Praesidium has two supported execution lowerings from one ASP-owned semantic
  resolution boundary. The default agent-harness path constructs and operates a
  Pi-backed session through agent-harness-sdk without consuming an ASPC-produced
  frontier-harness process plan or generated external-harness home. Agents that
  explicitly select Claude Code or Codex CLI retain a compiler-backed
  compatibility path that may produce the files, directories, arguments,
  environment, and process description those external harnesses require. Both
  paths consume shared ASP agent and space resolution, prompt and context
  assembly, skill discovery and composition, common provisioning values,
  validation, inspection, and diagnostics wherever the semantics are genuinely
  the same; Pi and the external harnesses own distinct lowering after that seam.
  HRC remains authority for runtime placement, lifecycle, session routing,
  supervision, and durable messaging on both paths. The selected harness
  executes turns and reports outputs and events but never decides scope
  placement or cross-node routing. Default cutover requires installed real-agent
  evidence for prompt and context, skills, tools and authentication, multi-turn
  continuation, steering and interruption, structured results and events, and
  HRC start, stop, and reconnect behavior, while an explicitly selected Claude
  Code or Codex CLI agent remains operable through the compatibility path.
  Internal resolved types, serialization, resource hashes or manifests,
  snapshot and read-only policy, credential transport, Pi API and version
  mechanics, broker protocol and process topology, and deferred extensions,
  hooks, MCP, slash commands, and TUI capabilities are not fixed by this
  invariant; existing ASP, HRC, product, and operating-system contracts govern
  them until a demonstrated requirement changes durable law.
authority: hrcchat#20722
source:
  - hrcchat#20722
  - commit:7ec0298
  - docs/proposals/agent-harness.md
  - core/config/src/core/types/harness.ts
  - harness/harness-broker-pi-sdk/src/driver.ts
  - docs/harness-architecture.md
required_tests:
  - wherever direct and compatibility paths require the same agent space prompt context skill provisioning validation inspection or diagnostic answer they consume one ASP-owned implementation
  - the default direct path starts and runs without a live ASPC compile request compiled frontier-harness process plan or generated external-harness home
  - explicit Claude Code and Codex CLI selections remain operable through compiler-backed compatibility lowering after the direct path becomes default
  - installed real-agent direct-path evidence covers prompt context skills tools authentication multi-turn continuation steer interrupt structured results and HRC-visible events
  - HRC can start stop and reconnect the direct harness with runtime placement session routing supervision and durable messaging authority unchanged
  - installed evidence covers at least one explicitly selected external-harness agent through the retained compatibility path
last_verified:
  date: 2026-08-24
  evidence: commit 7ec0298 and hrcchat#20722 approved by daedalus against current ASP Pi broker HRC and agent-profile source
reopen_when:
  - shared ASP semantics split into independent direct and compatibility implementations
  - HRC runtime placement lifecycle routing supervision or durable messaging authority moves into an execution lowering
  - the default direct path again requires compiler or external-harness artifacts
  - supported external-harness compatibility selections change
  - the installed real-agent cutover evidence or required product behavior changes
  - a new sandbox credential provenance resource-identity or deferred-capability requirement is adopted
supersedes:
  - agent-spaces.raspc-migration-contract
superseded_by: null
