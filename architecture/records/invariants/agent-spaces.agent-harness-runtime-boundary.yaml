id: agent-spaces.agent-harness-runtime-boundary
kind: invariant
status: active
owner_project: agent-spaces
scope: first-party agent-harness composition compilation release binding and broker ownership
predicate: >
  Amendment T-08680 (2026-09-21, corrected and ruled by Lance) preserves the
  agent-harness-tmux child topology while retiring only its private protocol.
  The agent-harness and agent-harness-tmux driver identities
  are served by one identity-bound agent-harness executable in an immutable ASP
  release. ASPC interprets the mutable agent declaration and emits a complete
  hash-covered broker profile. aspd selects only an inspected binding and
  freezes the exact release worker in executionRelease.worker.executable; both
  bindings name that executable and hostedDrivers is positive evidence derived
  from the release binding table. HRC launches that worker generically and
  retains placement, terminal-lease, lifecycle, routing, and durable-messaging
  authority, but it does not build an agent-harness plan, register either
  driver, import the first-party runtime, infer a worker, or speak an
  agent-harness-private protocol. Both profiles use the native-worker process
  alternative: no process command or arguments exist and harnessTransport is
  native-worker, meaning the already-external release worker directly owns the
  selected runtime and speaks the standard harness-broker protocol.
  Native-worker is distinct from HRC-local in-process execution. Under
  agent-spaces.producer-owned-harness-selection, agent-harness with presentation
  false resolves to the agent-harness driver with no terminal and owns the Pi
  runtime in the worker. Presentation true is a birth variant that resolves to
  agent-harness-tmux: HRC launches the outer release worker generically and
  supplies a tmux pane lease; the registered driver consumes that lease and
  launches the same release executable as a TUI child in the pane. A
  worker-local Unix socket carries the standard harness-broker protocol directly
  between them. The child registers the leaf agent-harness-tmux driver, owns Pi
  and InteractiveMode, and is the sole mapper for Pi events. A later
  presentation request cannot silently replace a live headless worker; changing
  birth variant requires an explicit lifecycle replacement.
  The outer driver verifies broker.hello and exact release identity, invokes the
  standard invocation methods, and re-sequences child envelopes into its real
  DriverContext. No agent-harness-control/v1, session-config, turn-begin, or
  other private wire contract exists. Both drivers require the semantic agent
  block and an internal Pi provider/model binding, while the public harness
  identity and outer runtime discriminator remain the distinct first-party
  agent-harness value. Pi and pi-sdk are not public harness identities or
  fallback selection routes. The shared Pi driver
  owns auth, permission, continuation, mapping, interruption, and disposal in
  the child; its presentation observes operator turns in that same mapper.
  Earendil InteractiveMode process exit is confined to the child and can never
  terminate the outer release worker. The direct runtime continues
  to use AgentSpacesResourceLoader as its sole resource-delivery boundary. It
  resolves ordered ASP sources and contextual prompt, reminder, skills, model,
  auth, permission, and environment without a harness adapter, compiler-built
  merged Pi bundle, ambient Pi discovery, or generated external-harness home;
  every replacement session reloads that boundary. Foreground asp run remains
  a separate local TUI/print surface using the same runtime factory. Existing
  external-harness, generic Pi SDK, Arris, Muse, and Desktop routes retain their
  own contracts, and HRC retains all non-execution semantic authority named by
  their active records.
authority: T-08680 native-worker amendment ruled by Lance 2026-09-21; prior T-08563 revision 5 approved by daedalus EN-13318 and hrcchat#21059; T-08594 Desktop amendment ruled by Lance; producer-owned selection amendment approved by EN-15959 and Lance on 2026-09-21
