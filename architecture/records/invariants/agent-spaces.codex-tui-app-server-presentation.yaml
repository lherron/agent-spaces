required_tests:
  - codex presentation false and true both resolve codex-app-server while false omits terminal hosting and true declares codex-tui websocket-unix plus tmux presentation hosting
  - no public or compiler selection path maps codex to codex-cli-tmux and the unselectable implementation cannot be reached by alias family runtime interaction or driver input
  - presentation can attach detach and reattach without changing worker runtime thread or frozen recipe identity and never silently replaces a live worker
  - the pane-owned presented app-server dies on pane runtime and broker teardown and no queued item executes outside its owning runtime
  - launch and later queue inputs use thread/queue/add originate distinct turns under human and goal races and preserve one disposition per submission
  - resume deletes every stored queue item before thread/resume and records each deletion diagnostically
  - codex-tui refuses approval policy other than never and its hooks remain raw provenance outside turn evidence
  - real-terminal validation covers broker and human turns steer interrupt continuation pane exit runtime cleanup and false-to-later-attachment
  - TUI and nonpresented Codex steering confirm only the exact native user item preserve initiating ownership and queue waiters and never duplicate the initial user message
last_verified:
  date: 2026-09-21
  evidence: T-08554 installed app-server attach detach reattach and post-attachment turns plus T-08699 installed capability probes; v2 selection implementation pending
reopen_when:
  - codex selection resolves any driver other than codex-app-server
  - presentation false requires a terminal or presentation true silently downgrades or replaces a live worker
  - codex-tui stops using one runtime-owned app-server with broker first and stock TUI second
  - an obligation-bearing input bypasses the broker FIFO or thread/queue/add or turn/start becomes a delivery path
  - exclusive or an approval policy other than never is exposed in codex-tui presentation
  - queue scrub can occur after thread load or an item can execute after its owning runtime dies
  - hooks mint turn evidence or the RPC notification stream stops being sole evidence authority
