id: agent-spaces.codex-tui-app-server-presentation
kind: invariant
status: active
owner_project: agent-spaces
scope: Codex app-server execution, optional operator presentation, delivery evidence, and lifetime
predicate: >
  Under agent-spaces.producer-owned-harness-selection, harness codex always
  resolves to the codex-app-server driver. Presentation false uses the
  JSON-RPC-stdio app-server recipe without a terminal surface. Presentation
  true uses the same driver and model session with codex-tui presentation,
  websocket-over-Unix transport, and an HRC-owned tmux surface; it never selects
  codex-cli-tmux. A later explicit presentation request may attach the stock
  remote Codex TUI to a live app-server without replacing that worker, while a
  request that cannot be fulfilled is refused rather than downgraded. Both
  presentation outcomes use native steering confirmation under
  agent-spaces.harness-broker-turn-evidence: turn/steer carries the pending
  client identity, and only its matching committed native user item confirms
  context entry without replacing initiating ownership. The transcript landing
  evidence enum denotes asynchronous provider evidence and nativeSourceKind
  remains provider-jsonrpc. A tmux-presented codex runtime owns exactly one app-server
  beneath the HRC-leased tmux pane wrapper; pane exit or teardown kills that
  server, so neither server nor queued work can outlive its owning runtime. The
  broker initializes and subscribes first with the experimental API enabled;
  the stock remote Codex TUI attaches as the second client after thread start or
  resume. The driver advertises steer and queue only. Launch and later
  obligation-bearing inputs enter the same broker-held FIFO and one head at a
  time reaches Codex via thread/queue/add with clientUserMessageId; turn/start
  is never sent and exclusive is unsupported. Resume scrubs every durable Codex
  queue item before loading the thread, and a runtime crash has at-least-once
  delivery semantics with the old submission failed and any resend carrying
  fresh identity. The RPC notification stream is the sole turn evidence
  authority. Observed brackets and attribution obey
  agent-spaces.harness-broker-turn-evidence, including fail-closed unknown
  attribution before an item. Approval policy is exactly never in the presented
  recipe. Stop and PostToolUse hooks are raw provenance and synchronous
  mail-stop control only; they mint no turn events. codex-cli-tmux may remain as
  an unselectable implementation until separately removed, but is not a
  compatibility route or public selection value.
  Harness codex-hrcpty also always resolves codex-app-server in both
  presentation outcomes under an hrc-pty supervisor lease. The broker spawns
  exactly one websocket-over-Unix app-server in its own process group and is
  its first client. No TUI runs at birth. A read-write attachment with no live
  TUI triggers the stock remote Codex TUI on the hrc-pty pty at the attaching
  client's size; read-only attachment never spawns it. The TUI attaches as the
  second client after thread start or resume. Detachment leaves it running;
  clean TUI exit ends the runtime, while nonzero exit leaves the worker
  headless and permits a fresh TUI on the next read-write attachment.
  On every broker exit, hrc-pty's broker waiter signals the broker's process
  group with TERM and KILLs surviving members after 5 seconds before emitting
  broker.exited, independently of HRC crash bookkeeping or lease teardown.
  Lease end also signals that group. The app-server and its admitted work
  are thus subject to bounded termination when their evidence-owning broker
  dies; work during that termination interval is outside the guarantee.
  Delivery, evidence, queue scrub and steering rules remain unchanged.
