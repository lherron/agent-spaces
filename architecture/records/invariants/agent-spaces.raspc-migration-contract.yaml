id: agent-spaces.raspc-migration-contract
kind: invariant
status: active
owner_project: agent-spaces
scope: raspc repository split and compiler-substitution cutover
predicate: >
  The compiler migration preserves the dependency direction harness to aspc to
  spaces-contracts: spaces-contracts owns the shared protocol and schema
  contracts, aspc owns compile-side materialization and the compile-only
  schema-backed facade, and HRC/harness retains process-spawn authority. During
  migration, normalized cross-host self-reproducibility is Mode A evidence only
  and can never authorize compiler substitution. The cutover gate is Mode B:
  aspc and rasp run on the same host against the same snapshotted ASP_HOME with
  identical pinned compile context and declared env/exec inputs; it compares
  every non-excluded emitted file's raw bytes and size without normalization,
  and deep-compares each complete schema-valid RPC response value, including
  plans, diagnostics, profiles, dispatch requests, prompts, attachments, and
  initial input. Only a green Mode B corpus and burn-in gate may authorize HRC
  cutover. TS byte compatibility is a migration oracle and retires after cutover
  in favor of the canonical format and schema contracts.
authority: hrcchat#19467
source:
  - hrcchat#19465
  - hrcchat#19467
  - docs/p0-hash-epoch.md
  - packages/aspc/src/manifest.ts
  - packages/aspc/src/verify-release.ts
  - packages/aspc/src/service.ts
  - packages/aspc-protocol/src/types.ts
  - packages/spaces-runtime-contracts/src/hash.ts
required_tests:
  - Mode B rejects any raw emitted-file byte or size difference between aspc and rasp
  - Mode B rejects any complete RPC response value difference, including initial input content and attachments
  - Mode A evidence cannot satisfy the Mode B HRC cutover gate
  - HRC cutover requires a green Mode B full corpus and live-traffic burn-in sample
last_verified:
  date: 2026-08-18
  evidence: hrcchat#19467 revision 2 closes hrcchat#19466 oracle flaws
reopen_when:
  - repository ownership or dependency direction changes
  - compiler process-spawn authority moves out of HRC/harness
  - the Mode A or Mode B equivalence relation changes
  - the compiler cutover or compatibility-retirement criterion changes
supersedes: []
superseded_by: null
