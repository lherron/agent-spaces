id: agent-spaces.aspd-rust-front-door
kind: invariant
status: active
owner_project: agent-spaces
scope: raspd compile daemon, phased Bun retirement, shared materialization, reference corpus, and observation boundary
predicate: >
  Under the T-13018 r2 retirement plan, raspd serves the public aspc socket.
  In fronted mode it answers native requests and forwards the remaining frames
  verbatim to the same immutable release's Bun upstream on a connection tied
  to the client connection. Without --upstream it serves sole mode and every
  request is answered natively or refused according to the approved inventory
  dispositions; it never implicitly discovers a Bun upstream. Refusals retain
  Bun's envelope and code where applicable, with the explicit r2 departures.
  Agent-harness and muse compile requests refuse unsupported_harness;
  registry-pinned spaces in the current target refuse
  registry_space_unsupported, without making another target's missing pin a
  refusal of this compile. Refused operations advertise false capabilities.
  The legacy caller scope shorthand and seven specified JavaScript coercion
  cases are refused; unreadable SOUL.md fails rather than silently compiling
  an empty prompt. Bad UTF-8 bytes are read with replacement as specified.
  Unreachable branches return internal errors rather than forwarding.
  Release-bound worker selection retains its existing authority and contracts.
  ASP materialization has no HRC execution-owner flip: native Rust and Bun
  writers share ASP_HOME only under the same lock and publication protocols.
  The global lock merge is locked, snapshot stages have collision-free names,
  and a losing snapshot publisher verifies the winning integrity directory and
  removes its own stage before reusing the winner. Input-decided refusals occur
  before the first write. Write-time I/O failures and lock timeouts fail the
  request without undoing earlier writes; request-wide atomicity is not
  promised. Global-lock updates retain successful-compile values and bundles
  publish complete under their fingerprints. Under the Codex-home lock, the
  completion record is set false before the first managed-file mutation and
  true with the fingerprint only after synchronization completes. A partial
  home matches no fingerprint and a subsequent compile resynchronizes it.
  Lock contention waits once per lock, for the existing 60-second window,
  then refuses lock_timeout. Global locks are schema-validated before use.
  Until the first sole-mode node cutover, Bun remains the semantic reference
  except for the explicitly approved r2 changes. At that cutover raspd becomes
  the compile-daemon reference; the frozen TypeScript compiler serves retained
  in-process callers until their separately specified migration and may drift
  from the daemon. The checked-in fixture and live-corpus recordings from the
  last dual-daemon release preserve the reference, including declared
  departures; deliberate changes re-record affected cases in the same commit
  for review. The approved fingerprint departure hashes staged files'
  executable bits rather than full modes. Comparisons hold absolute paths and
  the release directory equal across restored seeds; volatile inputs are
  enumerated from measured differences. Each subject's reported derived hashes
  are checked against its actual reported body before measured volatile inputs
  are tokenized and verified derived-hash fields omitted for body comparison.
  Namespace topology is distinct from release selection: sole-enable changes
  fronted to sole, front-door-enable restores fronted service with Bun from the
  active release, and activate preserves the namespace role. Sole activation
  refuses releases whose raspd predates sole-mode support. During retirement,
  rollback restores fronted topology before selecting an earlier release if
  needed. Nodes cut over hrcdev, svc, then max3, each after seven consecutive
  zero-product-relay days and with the specified native-birth and refusal
  smoke. Bun aspd remains in releases until all three nodes have run sole for
  seven days. A mixed fleet is transitional. Moving the CLI and ACP and
  deleting the TypeScript compiler require their later spec; the harness
  broker stays Bun. The embedded cardo kernel observes service
  events beside the aspc path and never mediates requests through its owner
  thread. Front-door and upstream logs remain separate. Over a closed drained
  and flushed window, per-op counts satisfy relayed <= Bun total <= relayed +
  upstream_failed; minute buckets carry no equality guarantee. HRC retains
  placement, worker hosting, lifecycle, and routing authority under the existing
  records. Per-node rollout and rollback are coordinated with the HRC owner.
