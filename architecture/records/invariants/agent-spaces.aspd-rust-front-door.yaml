required_tests:
  - Bun versus Bun at identical restored paths passes the measured parity comparison and a deliberately altered subject fails
  - concurrent Bun global-lock merges retain every entry and two cold snapshot publishers both succeed with red-before and green-after evidence
  - unchanged Bun HRC Rust HRC and avs clients exercise native and forwarded operations through the scratch front door and rollback restores Bun service
  - concurrent slow forwarded work does not stall native hello or health and cardo wire conformance passes against the installed kernel socket
  - drained per-op accounting obeys the stated bounds including a Bun-stopped-mid-run case and neither process shares a log file
  - native reads and live-recipe compiles match the phase-appropriate reference with declared departures and retain hash self-consistency and normalized body and tree comparison
  - real Bun and Rust HRC births use Rust compilation and racing Bun CLI and Rust compiles including a cold shared snapshot both succeed with consistent stores
  - runnable inventory refusal cases return their sole-mode envelopes and codes while input-decided refusals leave the stage byte-identical and native rows match the recording or declared departures
  - a Codex-home sync failure is refused and a retry after fault removal succeeds with a home identical to a clean compile
  - scratch sole-mode release without Bun supports Claude and Codex hrcpty births and Codex resume through rusthrc and returns unsupported_harness through the HRC 422 path
  - restoring fronted namespace topology after the sole-mode smoke serves the same agent-harness compile through Bun
  - existing fixture and both live corpora retain fronted-mode comparison and the checked-in reference corpus has its re-recording script
  - coordinated per-node retirement records seven zero-product-relay days before cutover and seven clean seat-birth days after it and preserves the HRC birth second-turn status and runtime-list smoke
last_verified:
  date: null
  evidence: T-13018 r2 design approved from source and recorded inventory reading on 2026-11-09; sole-mode implementation and retirement acceptance pending, with no runtime gate claimed
reopen_when:
  - fronted Rust and Bun serve different releases or a worker is inferred outside the immutable binding table
  - shared writers diverge on locks publication or snapshot integrity verification
  - input-decided refusal occurs after a write or a partially synchronized Codex home retains a matching completion record
  - sole mode discovers an implicit upstream or refusal envelopes codes or advertised operation support depart from the approved dispositions
  - daemon reference authority recording policy or the declared Bun departures change
  - activation changes namespace role implicitly or retirement loses its stated topology rollback
  - parity masks unmeasured differences or verifies a reported hash against tokenized rather than actual material
  - cardo mediates the aspc request path or acquires execution authority
  - logs share a file or relay failure accounting assumes every failed upstream request is absent from Bun
  - ASP gains HRC placement hosting lifecycle or routing authority
