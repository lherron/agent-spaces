required_tests:
  - raw and normalized append failure partial-tail restart and commit-before-publish fault injection
  - live and replay use one normalizer and produce one normalized identity across every crash boundary
  - every native type reaches one durable disposition and an unknown load-bearing queue operation warns and stops its cursor
  - each provider passes a real native-versus-hook authority matrix while Pi preserves its delivery-asserted bracket and non-authoritative JSONL posture
  - codex-tui terminal-before-item attribution and disposition are byte-identical under live normalization and raw-row replay without a live queue query
  - replay-to-follow has no seam gap and a slow observer disconnects typed within fixed queue bounds
  - HRC scalar acknowledgement and retention floor survive broker restart while a below-floor read-only observer fails typed without holding retention
  - owning-release offline reads recover committed DB+WAL state from a private copy, preserve every source byte, page completely within fixed bounds, report torn/corrupt/unstable evidence, and never expose acknowledgement or raw normalization
  - stale control connections cannot mutate or acknowledge and RPC acceptance is never reported as provider effect
  - broker timeout fallback commits requested and resolved permission facts before provider release and remains closed on commit failure
last_verified:
  date: 2026-09-16
  evidence: Daedalus source-grounded approvals of revised T-07853, T-08097 rev 13, and T-08565 rev 2 established committed provider-input normalization, replay-stable observed Codex attribution, and a second read-only owning-release access path with no retention claim; installed T-08565 gates pending
reopen_when:
  - provider or event-family authority changes
  - Pi initial bracket authority or its accepted-risk boundary changes
  - live and replay normalization diverge or an uncommitted normalized event can publish
  - raw disposition, source epoch, cursor, or blocked-unknown semantics change
  - observed attribution depends on live mutable state or differs between live ingest and replay
  - a second retention-bearing broker consumer is introduced
  - offline evidence reads can mutate source evidence, normalize raw rows, omit snapshot integrity, or gain execution/retention authority
  - observer mutation, acknowledgement, queue bounds, or replay-floor semantics change
  - broker control fencing or explicit-versus-timeout permission ownership changes
