id: agent-spaces.producer-owned-harness-selection
kind: invariant
status: active
owner_project: agent-spaces
scope: public harness selection, compiler recipe resolution, and singular aspd compilation
predicate: >
  Agent Spaces exposes exactly agent-harness, claude, codex, and muse as
  selectable harness identities. Harness identifies the agent implementation;
  model provider, model, reasoning effort, and boolean presentation remain
  independent inputs. The compiler owns the sole exhaustive execution catalog
  and pure resolver. Only that catalog maps harness and presentation to a
  builder, driver, protocol, process transport, terminal requirement,
  presentation fulfillment, and declared hosting requirements. Config parses
  and property-preservingly merges profile, project, directive, and explicit
  request scalars but selects no driver. Public contract packages own only
  vocabulary and DTOs. ASPC validates the envelope, invokes the compiler, and
  returns its singular result without a profile or driver selector. Resolution
  precedence is catalog defaults, agent profile, project target, per-summon
  directives, then explicit compile request. The default harness is
  agent-harness and default presentation is false. Omitted provider and model
  use the selected harness and provider defaults respectively; provider never
  infers harness, model never infers provider, and changing harness preserves
  explicit provider/model values so incompatibility is refused. Explicit false
  is preserved by property presence. A true presentation request resolves to a
  fulfilling intrinsic, attachable, or birth-variant recipe or returns a typed
  refusal, never a downgrade. The public v2 request requires a top-level agent
  id consistent with every explicit placement, bundle, and scope identity and
  rejects v1, viewer, aliases, frontend, family, runtime, interaction,
  controller, profile, and driver selectors. Ordinary compilation returns one
  execution and one canonical dispatch start request through public
  aspc.compileHarnessInvocation; compileRuntimePlan may remain an internal
  compiler/SDK method but is not a second public RPC. Builders consume an
  already-resolved recipe and cannot inspect raw selection fields. Foreground
  process preparation and explicitly named participant, Desktop, observer, and
  exact-profile operations remain separate from ordinary harness selection.
  Selection-bearing inputs fail closed at their first typed boundary: compile
  request/plan/profile v1, agent-profile TOML versions 1 through 3,
  asp-targets TOML schema 1, removed fields, aliases, and old directive keys are
  rejected without inference or translation. The only accepted TOML versions
  are agent-profile version 4 and asp-targets schema 2. V1 releases remain
  immutable historical artifacts but are not compatibility readers or fallback
  producers for v2. A v2 release must positively bind every driver its catalog
  can select, including Codex, before activation. ASP never silently
  reinterprets incompatible prepared or live state.
authority: Daedalus APPROVE EN-15959 with Lance's binding clean-cutover, four-harness, agent-harness-default, fail-closed-version, and approval-scope rulings on 2026-09-21
