required_tests:
  - the public harness keys are exactly agent-harness claude codex and muse and every harness/presentation cell resolves or returns a typed refusal
  - precedence and provenance cover catalog profile project directive and explicit request layers while explicit presentation false survives every boundary
  - omitted harness resolves to agent-harness and omitted presentation resolves to false at the catalog-default layer
  - agent-profile accepts only version 4 and asp-targets accepts only schema 2 while all predecessor versions viewer aliases and other removed fields fail without translation
  - provider cannot select harness model cannot select provider and a harness-only override preserves explicit provider/model before compatibility validation
  - v1 aliases viewer frontend family runtime interaction controller profile and driver selectors are rejected without translation fallback or deprecation
  - compile request plan and profile v1 agent-profile versions 1 through 3 and asp-targets schema 1 all fail at their first typed boundary
  - every ordinary compile returns one execution and one canonical start request with driver recipe hashes hosting evidence and frozen dispatch consistency
  - ASPC exposes compileHarnessInvocation as the sole public ordinary compile RPC and owns no catalog profile selection or driver mapping
  - repository enforcement rejects driver selection outside the compiler catalog raw selection reads in builders provider-to-harness mappings and catalog builder hosting incoherence
  - real installed aspd calls cover the four retained harnesses both presentation booleans invalid combinations and removed-field rejection
last_verified:
  date: 2026-09-21
  evidence: T-08699 source survey, installed CLI and driver probes, durable real-turn evidence from T-08554 T-08595 T-08601 and T-08680, and approved contract EN-15959; implementation pending
reopen_when:
  - a selectable harness is added removed aliased or inferred outside the four-value public vocabulary
  - any production authority outside the compiler catalog maps selection inputs to a driver or hosting recipe
  - ASPC regains profile or driver selection or exposes a second ordinary compile RPC
  - a provider or model silently selects a harness or an incompatible explicit value is discarded
  - omitted harness resolves to anything other than agent-harness
  - presentation false is treated as omission or terminal prohibition or requested true is silently downgraded
  - ordinary compilation becomes plural or carries multiple authoritative start requests
  - a v2 release can succeed without positive selected-driver hosting evidence
  - a selection-bearing legacy contract or TOML is inferred translated or accepted by a compatibility reader
