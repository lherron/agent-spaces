required_tests:
  - v2 release activation rejects unless bindings and positive hostedDrivers cover claude-code-tmux codex-app-server muse-serve muse-cli-tmux agent-harness and agent-harness-tmux
  - the identity-bound agent-harness executable passes release closure and identity inspection advertises both agent-harness drivers and owns both explicit bindings
  - aspd preparation for either agent-harness driver returns that exact executable with the selected driver in positive hostedDrivers and refuses missing or mismatched evidence before executionRelease
  - new release build and inspection validate worker bindings driver inventories identity and payload and asset digests
  - newly built v2 releases prepare and complete real Claude Codex Muse and agent-harness turns across both presentation values with the selected release worker and hostedDrivers containing the selected driver
  - neither caller input nor selectedProfile brokerDriver can select or override plan.execution.driver and its canonical start request
  - pi and pi-sdk remain unselectable even when retained implementation packages or bindings are present
  - an unbound selected driver returns release_worker_driver_unavailable before executionRelease and creates no worker pane or native harness
  - generated Claude and Pi settings wrappers launch descriptions panes and process trees resolve ASP-owned helpers beneath the selected immutable release and the Claude bundle carries the verified statusline bytes
  - retained v1 releases remain immutable historical artifacts but are rejected as v2 producers fallback readers and rollback compatibility paths
  - binding-aware A to B activation outage and saved-preparation proofs preserve frozen worker identity and live old-worker control
last_verified:
  date: 2026-09-21
  evidence: T-08561 proved binding and immutable-worker mechanics; T-08680 proved the dual-bound native agent-harness release worker; T-08699 records the approved v2 activation contract, whose implementation remains pending
reopen_when:
  - the participant-owned Desktop broker changes ownership or hosting
  - release worker selection stops deriving from the inspected binding table
  - hostedDrivers is inferred from registry inventory or changes from positive per-executable binding evidence
  - an unbound driver can receive executionRelease or cause a hosting effect
  - a release worker resolves an ASP-owned Claude or Pi helper or required statusline asset outside its immutable release payload
  - a retained v1 release is rewritten or is accepted as a v2-compatible producer fallback reader or rollback path
  - any of the six compiler-selectable drivers lacks a positive v2 release binding or Codex receives an exemption
  - caller input or a selectedProfile brokerDriver chooses the release worker instead of the compiler's singular execution and canonical dispatch request
  - pi or pi-sdk becomes a public selectable harness or an activation prerequisite for the four-harness v2 matrix
  - worker hosting lifecycle placement or routing authority moves from HRC
