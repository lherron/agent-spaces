id: agent-spaces.aspd-release-worker-hosting
kind: invariant
status: active
owner_project: agent-spaces
scope: immutable ASP release worker selection, helper closure, and positive hosting evidence
predicate: >
  Under agent-spaces.producer-owned-harness-selection, a v2 ASP release is
  activatable only when its immutable binding table positively covers every
  driver the four-harness catalog can select: claude-code-tmux,
  codex-app-server, muse-serve, muse-cli-tmux, agent-harness, and
  agent-harness-tmux. There is no Codex exemption and no inferred hosting.
  A binding-aware standalone ASP release declares each release-supported broker
  driver's worker executable and each required ASP-owned asset in its immutable
  release manifest. Inspection proves every declared worker is identity-bound,
  resolves inside that release, advertises every driver bound to it, and matches
  its recorded digests. That release's compiled aspd selects a worker only
  through the declared binding, freezes the selected executable in the existing
  per-preparation executionRelease.worker.executable, and emits
  executionRelease.worker.hostedDrivers as the sorted set of manifest bindings
  assigned to that executable. hostedDrivers is positive hosting evidence, not
  an inference from extra registered drivers; a missing selected-driver binding
  returns release_worker_driver_unavailable on the compile failure envelope
  before a successful v2 result or any hosting effect. The selected driver is
  compiler output carried by plan.execution.driver and the single canonical
  dispatch start request; neither caller input nor a selectedProfile brokerDriver
  chooses it. The identity-bound agent-harness release executable binds both
  agent-harness drivers and directly serves the standard broker protocol as a
  native worker. Pi implementation packages may remain shared infrastructure,
  but pi and pi-sdk are not selectable harnesses and a deferred generic Pi SDK
  binding is not part of the v2 activation matrix. ASP-owned Claude and Pi hook
  and tmux helpers execute through the selected release payload, and the
  verified Claude statusline asset is copied into the materialized bundle so no
  durable helper reference depends on PATH, import.meta, a checkout, or a
  retired release. Retained v1 release artifacts remain immutable historical
  artifacts with their own compiled behavior, but they are neither v2-compatible
  producers nor supported fallback or rollback readers for the v2 contract.
  HRC retains worker hosting, lifecycle, placement, and routing authority,
  except the participant-owned codex-desktop broker (T-08594, 2026-09-17,
  ruled by Lance, recorded hrc-runtime T-08567 C-23749): hook-started from the
  active release and served in-process, never HRC-hosted.
authority: Daedalus approval of wrkq T-08561 revision de063d73 and Pi SDK scope-narrowing amendment c6d821ce on 2026-09-16; T-08594 Desktop amendment under Lance ruling (hrc-runtime T-08567 C-23749); T-08680 native agent-harness worker amendment ruled by Lance 2026-09-21; producer-owned selection amendment approved by EN-15959 and Lance on 2026-09-21
