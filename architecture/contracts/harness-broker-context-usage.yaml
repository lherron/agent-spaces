validation_scope: >
  Requester acceptance uses real-wire-shaped fixtures, live codex-app-server
  and claude-code-tmux inspection across turns, the provider-reported Codex
  window, and Codex resume replay restoring context after broker restart without
  a new turn. Claude acceptance under T-10929 rev 4 covers a fresh Opus 5.5 seat
  whose inspection reading carries windowTokens 1000000 and usedTokens equal
  to the final statusline render, with the same final model call's transcript
  sum used only as comparison evidence. Requester tests cover committed
  StatusLine journal replay, null current_usage, unchanged reading suppression,
  transcript rows carrying no context, and unchanged script output with the
  bridge environment unset or a failed post. Requester evidence measures the
  StatusLine usage.updated sequence relative to turn.completed. HRC follow-on
  acceptance retains a live context reading at completed
  turns from the invocation's latest context-bearing sample below the terminal
  sequence, irrespective of the sample's turn identity. The completed turnId
  identifies the reading boundary, not the sample's originating model call;
  absence of any context-bearing sample produces no event. A projection unit
  test covers a previously stored sample with no prior in-memory state and
  repeated terminal projection producing one event with the persisted runtime
  reading unchanged. HRC's persisted reading appears in its existing
  status/session listing for an idle runtime after HRC restart; its producer
  contract is hrc-runtime's architecture/contracts/runtime-context-reading.yaml.
  T-10934 adds acceptance for a context-bearing usage.updated arriving with no
  active turn, so HRC's latest event and persisted reading match Claude's final
  statusline render even when it follows turn.completed; requester tests cover
  one emission on post-turn projection, no duplicate on replay, and no
  mid-turn emission. HRC owns that projection amendment.
  A live mid-turn HRC restart
  is outside this validation scope. Builds, gates, and live acceptance remain
  the requester's work.
