id: agent-spaces.harness-broker-context-usage
kind: contract
status: active
owner_project: agent-spaces
scope: normalized context usage and invocation inspection in the harness-broker protocol
predicate: >
  usage.updated preserves its driver-specific raw usage and may additionally
  carry context with usedTokens and optional windowTokens. A present usedTokens
  is a non-negative integer; a present windowTokens is a positive integer.
  Malformed context is rejected by the producer-owned event validator. Drivers
  omit context when usedTokens cannot be computed and never guess a window.
  codex-app-server derives usedTokens from usage.last.totalTokens and the window
  from usage.modelContextWindow. codex-desktop derives them from
  info.last_token_usage.total_tokens and info.model_context_window. Claude
  assistant-row context is input_tokens plus cache_read_input_tokens plus
  cache_creation_input_tokens plus output_tokens, with no inferred window.
  The broker projects the latest context-bearing committed usage.updated by
  invocation sequence into InvocationInspectionSummary.context. That sample
  contains usedTokens, optional windowTokens, the sample's optional model and
  turnId, observedAt from its envelope time, and seq from its envelope sequence.
  Omitted metadata is not borrowed from a previous sample. The sample persists
  for the invocation's life, is not cleared at turn end, and introduces no
  retention claim. Status, snapshot, and listInvocations expose the same sample
  through the existing inspection summary without a new RPC. A sample without
  a turn identity remains useful inspection evidence and establishes no claim
  that it belongs to a later completed turn. HRC continues to own its canonical
  event projection under its existing committed-observation contract; this ASP
  contract establishes neither a new HRC event name nor a retention consumer.
authority: Daedalus approval of wrkq:T-10927 specification etag 4, resubmitted in EN-29754, 2026-10-14
source:
  - wrkq:T-10927
  - wrkq:EN-29754
  - architecture/records/invariants/agent-spaces.harness-broker-local-commit-observation.yaml
  - architecture/contracts/harness-broker-evidence-authority.md
