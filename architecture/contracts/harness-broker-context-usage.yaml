validation_scope: >
  Requester acceptance uses real-wire-shaped fixtures, live codex-app-server
  and claude-code-tmux inspection across turns, the provider-reported Codex
  window, and Codex resume replay restoring context after broker restart without
  a new turn. HRC follow-on acceptance covers a live context reading at completed
  turns from the invocation's latest context-bearing sample below the terminal
  sequence, irrespective of the sample's turn identity. The completed turnId
  identifies the reading boundary, not the sample's originating model call;
  absence of any context-bearing sample produces no event. A projection unit
  test covers a previously stored sample with no prior in-memory state and
  repeated terminal projection producing one event with the persisted runtime
  reading unchanged. HRC's persisted reading appears in its existing
  status/session listing for an idle runtime after HRC restart; its producer
  contract is hrc-runtime's architecture/contracts/runtime-context-reading.yaml.
  A live mid-turn HRC restart
  is outside this validation scope. Builds, gates, and live acceptance remain
  the requester's work.
last_verified: 2026-10-14 source-grounded design approval only; implementation and live acceptance pending
reopen_when: Normalized token meaning, window authority, sample metadata, omission semantics, inspection retention, or producer/consumer authority changes.
