# Git hooks configuration
# Install: lefthook install
# Docs: https://github.com/evilmartians/lefthook

min_version: "2.1.10"
lefthook: bun scripts/run-lefthook-with-timing.ts

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: bun scripts/run-hook-command.ts pre-commit {lefthook_job_name} -- gitleaks protect --staged --redact
    lint:
      run: bun scripts/run-hook-command.ts pre-commit {lefthook_job_name} -- bun run biome check --staged --no-errors-on-unmatched

pre-push:
  parallel: false
  # Keep the hook alive for deleted paths, which Lefthook omits from push_files.
  files: printf 'lefthook.yml\n'
  commands:
    # `just verify` runs after the push on mini's self-hosted runner (T-10161,
    # .github/workflows/post-push-verify.yml); the hook only reports the push.
    # One stdin consumer: Lefthook cannot fan pre-push stdin out to commands.
    git-push-fact:
      use_stdin: true
      run: sh -c 'wrkp="$HOME/.local/bin/wrkp"; [ -x "$wrkp" ] && "$wrkp" git push "$@" || true' sh {0}

post-commit:
  commands:
    wrkp-git-commit:
      run: wrkp="$HOME/.local/bin/wrkp"; [ -x "$wrkp" ] && "$wrkp" git commit || true
