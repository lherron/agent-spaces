version = 3

[instructions]
base = ["agent-root:///SOUL.md"]

[spaces]
base = ["space:agent:private-ops"]

[spaces.modes.heartbeat]
base = ["space:agent:task-worker"]

[targets.review]
compose = ["space:agent:private-ops", "space:project:repo-defaults"]

[targets.delivery]
compose = ["space:agent:task-worker", "space:project:task-scaffolds"]

[provisioning]
sandbox = "workspace-write"
approval = "on-request"
