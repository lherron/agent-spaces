[workspace]
resolver = "2"
members = ["aspd-domain", "raspd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Every cardo crate names this one rev (cardo embedding guide §1). For local
# work against a cardo checkout, patch it on the command line:
#   cargo build --config 'patch."https://github.com/lherron/cardo".cardo-runtime.path="../../cardo/crates/cardo-runtime"' ...
cardo-core = { git = "https://github.com/lherron/cardo", rev = "12bd05d758a936d12288bc0f102bb2833ecfa924" }
cardo-host = { git = "https://github.com/lherron/cardo", rev = "12bd05d758a936d12288bc0f102bb2833ecfa924" }
cardo-runtime = { git = "https://github.com/lherron/cardo", rev = "12bd05d758a936d12288bc0f102bb2833ecfa924" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "fs"] }
libc = "0.2"
